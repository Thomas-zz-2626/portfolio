name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# 自动部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一次部署，避免冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci

      - name: 构建生产版本
        run: npm run build

      - name: 上传到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
